spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: true

  security:
    enabled: false

logging:
  level:
    org.springframework.security: WARN
    org.example.ais_sst: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO
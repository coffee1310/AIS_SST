databaseChangeLog:
  - changeSet:
      id: 20240602-add-event-participants-table-simple
      author: coffee13102006
      labels: event-participants
      comment: "Создание таблицы участников мероприятий и добавление поля max_participants_count в таблицу events"
      changes:
        # Создание таблицы event_participants
        - createTable:
            tableName: event_participants
            remarks: "Таблица для хранения участников мероприятий"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_event_participants
                    nullable: false

              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_participants_event
                    references: events(id)

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_participants_user
                    references: users(id)

        # Добавление составного уникального индекса
        - addUniqueConstraint:
            constraintName: uk_event_participants_event_user
            tableName: event_participants
            columnNames: event_id, user_id

        # Добавление индексов для производительности
        - createIndex:
            indexName: idx_event_participants_event_id
            tableName: event_participants
            columns:
              - column:
                  name: event_id

        - createIndex:
            indexName: idx_event_participants_user_id
            tableName: event_participants
            columns:
              - column:
                  name: user_id

        # Добавление поля в таблицу events
        - addColumn:
            tableName: events
            columns:
              - column:
                  name: max_participants_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
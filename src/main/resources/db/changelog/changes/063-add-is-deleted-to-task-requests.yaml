databaseChangeLog:
  - changeSet:
      id: add-is-deleted-to-task-requests
      author: coffee13102006
      comment: "Add is_deleted column to task_requests table"
      changes:
        - addColumn:
            tableName: task_requests
            columns:
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - createIndex:
            tableName: task_requests
            indexName: idx_task_requests_is_deleted
            columns:
              - column:
                  name: is_deleted

      rollback:
        - dropIndex:
            tableName: task_requests
            indexName: idx_task_requests_is_deleted
        - dropColumn:
            tableName: task_requests
            columnName: is_deleted
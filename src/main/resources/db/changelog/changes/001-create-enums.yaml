databaseChangeLog:
  - changeSet:
      id: 001-create-enum-genders
      author: your_name
      changes:
        - createSequence:
            sequenceName: hibernate_sequence
            startValue: 1
            incrementBy: 1

        - sql:
            sql: |
              DO $$ BEGIN
                CREATE TYPE genders AS ENUM('Мужчина', 'Женщина');
              EXCEPTION
                WHEN duplicate_object THEN null;
              END $$;

        - sql:

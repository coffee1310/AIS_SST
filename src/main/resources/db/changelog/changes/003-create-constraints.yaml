databaseChangeLog:
  - changeSet:
      id: 003-add-foreign-keys-and-constraints
      author: your_name
      changes:
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: speciality_id
            referencedTableName: specialities
            referencedColumnNames: id
            constraintName: fk_users_speciality
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_users_group
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role

        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_event
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: venue
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: photo
                  type: BYTEA
              - column:
                  name: reference_to_position
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: is_draft
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: organizer_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: is_completed
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
            constraints:
              - checkConstraint:
                  constraintName: chk_events_date_of_event
                  condition: date_of_event >= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: organizer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_events_organizer

        - createTable:
            tableName: sectors
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: current_coordinator_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: photo
                  type: BYTEA

        - addForeignKeyConstraint:
            baseTableName: sectors
            baseColumnNames: current_coordinator_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_sectors_coordinator

        - createTable:
            tableName: sector_participants
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: sector_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: entry_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: sector_participant_statuses
                  defaultValue: 'Активный'
                  constraints:
                    nullable: false
            constraints:
              - checkConstraint:
                  constraintName: chk_sector_participants_entry_date
                  condition: entry_date <= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: sector_participants
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_sector_participants_student

        - addForeignKeyConstraint:
            baseTableName: sector_participants
            baseColumnNames: sector_id
            referencedTableName: sectors
            referencedColumnNames: id
            constraintName: fk_sector_participants_sector

        - createTable:
            tableName: roles_as_the_event
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: deadline_by_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: deadline_by_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: people_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: reserve_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: count_of_points
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: responsible_sector_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: is_accepting_applications_open
                  type: BOOLEAN
                  constraints:
                    nullable: false
            constraints:
              - checkConstraint:
                  constraintName: chk_roles_event_deadline_date
                  condition: deadline_by_date >= CURRENT_DATE
              - checkConstraint:
                  constraintName: chk_roles_event_people_count
                  condition: people_count >= 0
              - checkConstraint:
                  constraintName: chk_roles_event_reserve_count
                  condition: reserve_count >= 0
              - checkConstraint:
                  constraintName: chk_roles_event_points
                  condition: count_of_points >= 0

        - addForeignKeyConstraint:
            baseTableName: roles_as_the_event
            baseColumnNames: responsible_sector_id
            referencedTableName: sectors
            referencedColumnNames: id
            constraintName: fk_roles_event_sector

        - addForeignKeyConstraint:
            baseTableName: roles_as_the_event
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_roles_event_event

        - createTable:
            tableName: applications_for_the_role
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: role_application_statuses
                  constraints:
                    nullable: false
              - column:
                  name: date_of_application
                  type: DATE
            constraints:
              - checkConstraint:
                  constraintName: chk_applications_role_date
                  condition: date_of_application <= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: applications_for_the_role
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_applications_role_student

        - addForeignKeyConstraint:
            baseTableName: applications_for_the_role
            baseColumnNames: role
            referencedTableName: roles_as_the_event
            referencedColumnNames: id
            constraintName: fk_applications_role_role

        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: people_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: count_of_points
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: is_it_only_available_to_the_board
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_completed
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
            constraints:
              - checkConstraint:
                  constraintName: chk_tasks_points
                  condition: count_of_points >= 0

        - createTable:
            tableName: task_requests
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: task_application_statuses
                  defaultValue: 'На рассмотрении'
                  constraints:
                    nullable: false
              - column:
                  name: filing_date
                  type: DATE
                  constraints:
                    nullable: false
            constraints:
              - checkConstraint:
                  constraintName: chk_task_requests_filing_date
                  condition: filing_date <= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: task_requests
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_task_requests_task

        - addForeignKeyConstraint:
            baseTableName: task_requests
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_task_requests_student

        - createTable:
            tableName: portfolios
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: path_to_file
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

        - createTable:
            tableName: applications_for_membership
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_owner_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: path_to_file
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: application_statuses_for_membership
                  defaultValue: 'На рассмотрении'
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: applications_for_membership
            baseColumnNames: document_owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_applications_membership_owner

        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT

        - createTable:
            tableName: conducting_classes
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: format
                  type: formats_for_conducting_classes
                  defaultValue: 'Очно'
                  constraints:
                    nullable: false
              - column:
                  name: venue
                  type: VARCHAR(128)

        - createTable:
            tableName: internal_projects
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: conducting_classes_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: photo
                  type: BYTEA
              - column:
                  name: reference_to_position
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_draft
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: internal_projects
            baseColumnNames: conducting_classes_id
            referencedTableName: conducting_classes
            referencedColumnNames: id
            constraintName: fk_internal_projects_classes

        - createTable:
            tableName: lessons
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cabinet
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: internal_project_id
                  type: INTEGER
                  constraints:
                    nullable: false
            constraints:
              - checkConstraint:
                  constraintName: chk_lessons_date
                  condition: date >= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: lessons
            baseColumnNames: internal_project_id
            referencedTableName: internal_projects
            referencedColumnNames: id
            constraintName: fk_lessons_project

        - createTable:
            tableName: project_participants
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: date_of_accession
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
            constraints:
              - checkConstraint:
                  constraintName: chk_project_participants_accession_date
                  condition: date_of_accession <= CURRENT_DATE

        - addForeignKeyConstraint:
            baseTableName: project_participants
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_project_participants_user

        - createTable:
            tableName: registrations_for_a_lesson
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: participant_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: count_of_points
                  type: INTEGER
                  defaultValueNumeric: 0
            constraints:
              - checkConstraint:
                  constraintName: chk_registrations_points
                  condition: count_of_points >= 0

        - addForeignKeyConstraint:
            baseTableName: registrations_for_a_lesson
            baseColumnNames: participant_id
            referencedTableName: project_participants
            referencedColumnNames: id
            constraintName: fk_registrations_participant
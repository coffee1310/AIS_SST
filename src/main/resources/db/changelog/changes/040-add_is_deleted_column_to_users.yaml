databaseChangeLog:
  - changeSet:
      id: add_is_deleted_column_to_users
      author: developer
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  constraints:
                    nullable: true
        - update:
            tableName: users
            columns:
              - column:
                  name: is_deleted
                  valueBoolean: false
            where: is_deleted IS NULL
        - addNotNullConstraint:
            tableName: users
            columnName: is_deleted
            defaultNullValue: false
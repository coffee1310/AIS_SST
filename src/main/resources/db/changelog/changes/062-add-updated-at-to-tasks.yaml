databaseChangeLog:
  - changeSet:
      id: add-updated-at-to-tasks
      author: your-name
      comment: "Add updated_at column to tasks table"
      changes:
        - addColumn:
            tableName: tasks
            columns:
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true

      rollback:
        - dropColumn:
            tableName: tasks
            columnName: updated_at
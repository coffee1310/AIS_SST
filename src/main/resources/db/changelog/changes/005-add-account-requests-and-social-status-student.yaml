# ==================== ДОБАВЛЕНИЕ НОВЫХ ТАБЛИЦ И ПОЛЕЙ ====================
databaseChangeLog:
  # ==================== ДОБАВЛЕНИЕ НОВЫХ ТАБЛИЦ И ПОЛЕЙ ====================
  - changeSet:
      id: 006-add-account-requests-and-social-status-student
      author: coffee13102006
      changes:
        # Создание типа ENUM для статусов заявок
        - sql:
            sql: |
              DO $$ BEGIN
                CREATE TYPE account_creating_requests_statuses AS ENUM ('На рассмотрении', 'Одобрена', 'Отклонена');
              EXCEPTION
                WHEN duplicate_object THEN null;
              END $$;

        # Создание таблицы заявок на регистрацию
        - createTable:
            tableName: account_creating_requests
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: patronymic
                  type: VARCHAR(64)
              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: course_number
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: speciality_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: student_id_number
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: student_email
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone_number
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: reason_for_refusal
                  type: TEXT
              - column:
                  name: password
                  type: VARCHAR(256)
                  constraints:
                    nullable: false

        # Создание таблицы связи социальных статусов со студентами
        - createTable:
            tableName: social_status_students
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: social_status_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: INTEGER
                  constraints:
                    nullable: false

        # Добавление поля account_creating_request_id в таблицу users
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: account_creating_request_id
                  type: INTEGER
                  constraints:
                    nullable: true
                    unique: true

        # Добавление поля reason_for_refusal в таблицу users
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reason_for_refusal
                  type: TEXT
                  constraints:
                    nullable: true

        # Удаление поля social_status_id из таблицы users
        - dropColumn:
            tableName: users
            columns:
              - column:
                  name: social_status_id

  - changeSet:
      id: 007-add-foreign-keys-for-new-tables
      author: coffee13102006
      changes:
        # Foreign key для account_creating_requests.speciality_id
        - addForeignKeyConstraint:
            baseTableName: account_creating_requests
            baseColumnNames: speciality_id
            referencedTableName: specialities
            referencedColumnNames: id
            constraintName: fk_account_requests_speciality
            onDelete: CASCADE

        # Foreign key для account_creating_requests.group_id
        - addForeignKeyConstraint:
            baseTableName: account_creating_requests
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_account_requests_group
            onDelete: CASCADE

        # Foreign key для users.account_creating_request_id
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: account_creating_request_id
            referencedTableName: account_creating_requests
            referencedColumnNames: id
            constraintName: fk_users_account_request
            onDelete: SET NULL

        # Foreign key для social_status_students.social_status_id
        - addForeignKeyConstraint:
            baseTableName: social_status_students
            baseColumnNames: social_status_id
            referencedTableName: social_statuses
            referencedColumnNames: id
            constraintName: fk_social_status_students_status
            onDelete: CASCADE

        # Foreign key для social_status_students.student_id
        - addForeignKeyConstraint:
            baseTableName: social_status_students
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_social_status_students_user
            onDelete: CASCADE

  - changeSet:
      id: 008-add-check-constraints-for-new-tables
      author: coffee13102006
      changes:
        - sql:
            sql: |
              ALTER TABLE account_creating_requests 
              ADD CONSTRAINT chk_account_requests_date_of_birth 
              CHECK (date_of_birth < CURRENT_DATE);
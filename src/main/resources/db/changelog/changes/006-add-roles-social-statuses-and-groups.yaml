databaseChangeLog:
  - changeSet:
      id: 010-insert-roles
      author: coffee13102006
      comment: "Заполнение ролей (только если их нет)"
      changes:
        - sql:
            sql: |
              INSERT INTO roles (title)
              SELECT 'Administrator'
              WHERE NOT EXISTS (SELECT 1 FROM roles WHERE title = 'Administrator');

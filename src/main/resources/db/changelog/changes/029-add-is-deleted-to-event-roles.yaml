databaseChangeLog:
  - changeSet:
      id: 050-add-is-deleted-to-event-roles
      author: coffee13102006
      labels: add-column
      comment: "Добавление поля is_deleted в таблицу event_roles"
      changes:
        # Добавляем колонку is_deleted
        - addColumn:
            tableName: event_roles
            columns:
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: "Флаг мягкого удаления"

        # Добавляем индекс
        - createIndex:
            indexName: idx_event_roles_is_deleted
            tableName: event_roles
            columns:
              - name: is_deleted

        # Добавляем уникальное ограничение для пары event_id и global_event_role_id где is_deleted = false
        - sql:
            comment: "Добавление уникального ограничения для активных записей"
            sql: |
              DROP INDEX IF EXISTS idx_unique_active_event_role;
              CREATE UNIQUE INDEX idx_unique_active_event_role 
              ON event_roles (event_id, global_event_role_id) 
              WHERE is_deleted = false;
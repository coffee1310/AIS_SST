databaseChangeLog:
  - changeSet:
      id: add-is-deleted-to-event-participation-records
      author: your-name
      comment: "Add is_deleted column to event_participation_records table for soft delete support"
      changes:
        - addColumn:
            tableName: event_participation_records
            columns:
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: event_participation_records
            columnName: is_deleted
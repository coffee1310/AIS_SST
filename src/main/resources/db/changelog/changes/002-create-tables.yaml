databaseChangeLog:
  - changeSet:
      id: 002-create-base-tables
      author: your_name
      changes:
        - createTable:
            tableName: specialities
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: social_statuses
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: patronymic
                  type: VARCHAR(64)
              - column:
                  name: gender
                  type: genders
                  constraints:
                    nullable: false
              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: course_number
                  type: SMALLINT
              - column:
                  name: speciality_id
                  type: INTEGER
              - column:
                  name: group_id
                  type: INTEGER
              - column:
                  name: student_id_number
                  type: INTEGER
              - column:
                  name: student_email
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: additional_email
                  type: VARCHAR(256)
              - column:
                  name: phone_number
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: vk_link
                  type: VARCHAR(256)
              - column:
                  name: photo
                  type: BYTEA
              - column:
                  name: password
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: is_banned
                  type: BOOLEAN
                  defaultValueBoolean: false
            constraints:
              - checkConstraint:
                  constraintName: chk_users_date_of_birth
                  condition: date_of_birth < CURRENT_DATE